<header class="topbar">
<div class="topbar-inner">
<h1>挖地尋寶 推算助手</h1>
</div>

</div>

<button type="button" class="reset" id="reset">全部重設</button>
</div>

<script>
const N = 8;
const MODES = [["empty", "空格"], ["group", "整件寶藏"], ["clear", "清除"]];
const TYPES = {
p2: { name: "2格 直橫都可", base: "p2", shapes: [[1, 2], [2, 1]] },
p2v: { name: "直行 2格", base: "p2", shapes: [[2, 1]] },
p2h: { name: "橫行 2格", base: "p2", shapes: [[1, 2]] },
p3: { name: "3格 直橫都可", base: "p3", shapes: [[1, 3], [3, 1]] },
p3v: { name: "直行 3格", base: "p3", shapes: [[3, 1]] },
p3h: { name: "橫行 3格", base: "p3", shapes: [[1, 3]] },
q2: { name: "2×2", base: "q2", shapes: [[2, 2]] },
q3: { name: "3×3", base: "q3", shapes: [[3, 3]] }
};
const ORDER = ["q3", "q2", "p3v", "p3h", "p3", "p2v", "p2h", "p2"];
const DONE = { p2: 4, p3: 5, q2: 6, q3: 7 };
const COL = { p2: "#D9B92E", p3: "#4A90D0", q2: "#2FA66A", q3: "#CC4560" };
const DEFAULT_COUNTS = { p2: 0, p2v: 1, p2h: 1, p3: 0, p3v: 1, p3h: 2, q2: 2, q3: 2 };
const ZERO = { p2: 0, p2v: 0, p2h: 0, p3: 0, p3v: 0, p3h: 0, q2: 0, q3: 0 };
const LAYOUTS = {
1: { p2v: 1, p2h: 1, p3v: 1, p3h: 2, q2: 2, q3: 2 },
2: { p2h: 2, p2v: 1, p3v: 3, p3h: 2, q2: 2, q3: 1 },
3: { p2h: 3, p3v: 1, p3h: 2, q2: 4, q3: 1 },
4: { p2h: 1, p3h: 4, q2: 5 }
};
let layout = 1;
function layoutText(n) {
const L = LAYOUTS[n], nm = { p2v: "1x2直", p2h: "1x2橫", p3v: "1x3直", p3h: "1x3橫", q2: "2x2", q3: "3x3" };
return Object.keys(nm).filter(k => L[k]).map(k => nm[k] + " ×" + L[k]).join("、");
}
function applyLayout(n) {
if (state.some(v => v !== 0) && !confirm("切換版面會清空目前盤面，確定嗎？")) return;
sel.clear();
state = new Array(N * N).fill(0);
gid = new Array(N * N).fill(0);
gnext = 1;
gbk = {};
counts = { ...ZERO, ...LAYOUTS[n] };
layout = n;
save();
touch();
render();
}
const DEFAULT_TREASURE = [];
const PL = {};
for (const k of ORDER) {
PL[k] = [];
for (const [h, w] of TYPES[k].shapes) {
for (let r = 0; r <= N - h; r++) {
for (let c = 0; c <= N - w; c++) {
const cells = [];
for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) cells.push((r + i) * N + c + j);
PL[k].push(cells);
}
}
}
}
let state = new Array(N * N).fill(0);
let counts = { ...DEFAULT_COUNTS };
let mode = "empty";
let prob = new Array(N * N).fill(0), samples = 0, picks = [];
let timer = null, dirty = false, plcData = null, hl = new Set(), hlKey = "";
function touch() {
clearTimeout(timer);
runId++;
if (running && worker) {
try { worker.terminate(); } catch (e) {}
worker = null;
}
running = false;
dirty = true;
hl = new Set();
hlKey = "";
}
let sel = new Set(), hist = [];
let gid = new Array(N * N).fill(0), gnext = 1, gbk = {};
function pushHist() {
hist.push(JSON.stringify({ state, counts, gid, gnext, gbk }));
if (hist.length > 60) hist.shift();
}
function typeOf(code) {
return ({ 4: "p2", 5: "p3", 6: "q2", 7: "q3" })[code];
}
function clearCell(i) {
if (state[i] >= 4 && gid[i]) {
const id = gid[i], bk = gbk[id] || typeOf(state[i]);
for (let j = 0; j < N * N; j++) if (gid[j] === id) { state[j] = 0; gid[j] = 0; }
if (bk && counts[bk] !== undefined) counts[bk]++;
delete gbk[id];
} else {
state[i] = 0;
gid[i] = 0;
}
}
function detect() {
if (!sel.size) return null;
const rs = [...sel].map(i => Math.floor(i / N)), cs = [...sel].map(i => i % N);
const h = Math.max(...rs) - Math.min(...rs) + 1, w = Math.max(...cs) - Math.min(...cs) + 1;
if (sel.size !== h * w) return null;
const a = Math.min(h, w), b = Math.max(h, w);
const o = h > w ? "v" : (w > h ? "h" : null);
if (a === 1 && b === 2) return { t: "p2", o };
if (a === 1 && b === 3) return { t: "p3", o };
if (a === 2 && b === 2) return { t: "q2", o: null };
if (a === 3 && b === 3) return { t: "q3", o: null };
return null;
}
function bucketFor(d) {
if (!d) return null;
if (d.t === "q2" || d.t === "q3") return counts[d.t] > 0 ? d.t : null;
const sp = d.t + d.o;
if (counts[sp] > 0) return sp;
if (counts[d.t] > 0) return d.t;
return null;
}
function pieceName(d) {
if (d.t === "q2") return "2×2";
if (d.t === "q3") return "3×3";
return (d.o === "v" ? "直行 " : "橫行 ") + (d.t === "p2" ? "2格" : "3格");
}
function confirmGroup() {
const d = detect(), bk = bucketFor(d);
if (!bk) return;
pushHist();
const id = gnext++;
for (const i of sel) { state[i] = DONE[d.t]; gid[i] = id; }
gbk[id] = bk;
counts[bk] = Math.max(0, counts[bk] - 1);
sel.clear();
save();
touch();
render();
}
function renderBar() {
const bar = document.getElementById("gbar");
bar.style.display = mode === "group" ? "block" : "none";
if (mode !== "group") return;
const d = detect();
let h = "";
if (!sel.size) {
h = '<div class="small">點選同一個寶藏的所有格子，再按確認，可連續選。</div>';
} else if (d) {
const bk = bucketFor(d), nm = pieceName(d);
if (bk) {
const c = counts[bk];
h = `<div class="gbar-msg">已選 ${sel.size} 格 → <b>${nm}</b></div><button type="button" class="gbtn" data-a="ok">確認（${TYPES[bk].name}：${c} → ${c - 1}）</button>`;
} else {
h = `<div class="gbar-msg">已選 ${sel.size} 格 → <b>${nm}</b></div><button type="button" class="gbtn" data-a="ok" disabled>確認</button><div class="small" style="margin-top:6px">這種寶藏的剩餘數量已經是 0，請先調整下方數量。</div>`;
}
} else {
h = `<div class="gbar-msg">已選 ${sel.size} 格，形狀不符</div><div class="small">需要是 1×2、1×3、2×2、3×3 的長方形。</div>`;
}
if (sel.size) h += '<button type="button" class="gbtn sec" data-a="cancel">取消選取</button>';
if (bar.dataset.h !== h) {
bar.innerHTML = h;
bar.dataset.h = h;
}
}
function defaults() {
state = new Array(N * N).fill(0);
for (const [r, c] of DEFAULT_TREASURE) state[(r - 1) * N + c - 1] = 2;
counts = { ...DEFAULT_COUNTS };
layout = 1;
gid = new Array(N * N).fill(0);
gnext = 1;
gbk = {};
}
function save() {
try {
localStorage.setItem("digHelper2", JSON.stringify({ v: 7, state, counts, gid, gnext, gbk, layout }));
} catch (e) {}
}
function load() {
try {
const s = localStorage.getItem("digHelper2");
if (s) {
const o = JSON.parse(s);
if (o.state && o.state.length === N * N && LAYOUTS[o.layout]) {
state = o.state.map(x => x === 2 ? 0 : x);
counts = o.v === 7 ? { ...DEFAULT_COUNTS, ...o.counts, p2: 0, p3: 0 } : { ...DEFAULT_COUNTS };

style = `grid-row:${r + 2} / span ${bk.h};grid-column:${c + 2} / span ${bk.w};aspect-ratio:auto;`;
}
if (p > 0) {
style += `background:rgba(var(--heat-rgb),calc(${p.toFixed(4)} * var(--heat-max)))`;
}
txt = Math.round(p * 100) + "%";
if (dirty) cls += " stale";
else if (p >= 1 - 1e-9) cls += " sure";
}
if (!dirty && (bk ? bk.top : picks.includes(i))) cls += " top";
} else if (s === 1) {
txt = "✕";
} else if (s === 2) {
html = GEM_SVG;
} else {
txt = "✓";
}
const isSel = bk ? bk.cells.every(x => sel.has(x)) : sel.has(i);
if (isSel) cls += " sel";
if (hl.has(i)) cls += " hl";
const el = els[i];
if (el.className !== cls) el.className = cls;
if (el.dataset.st !== style) { el.style.cssText = style; el.dataset.st = style; }
if (html) {
if (el.dataset.ht !== "gem") { el.innerHTML = html; el.dataset.ht = "gem"; }
} else {
if (el.dataset.ht) { el.dataset.ht = ""; }
if (el.textContent !== txt) el.textContent = txt;
}
}
const sg = document.getElementById("sug");
const need = remTotal();
if (running) {
sg.innerHTML = "計算中…";
} else if (dirty) {
sg.innerHTML = '盤面已變更，請按「計算機率」更新建議。<br><span class="small">格子上的 % 是上次的結果，僅供參考。</span>';
} else if (!samples) {
sg.innerHTML = "找不到符合目前資料的擺法，所以格子沒有顯示機率。<br>" + diagnose();
} else if (need === 0) {
sg.innerHTML = state.some(v => v >= 3) ? "下方數量都是 0，代表寶藏都找齊了，不需要再挖。" : "請先在上方選擇版面。";
} else {
let t;
if (bmap.size) {
const bl = [...bmap.values()];
t = `<b>建議先挖：</b>` + bl.filter(b => b.top).slice(0, 8).map(b => `${placeName(b.cells)}（${Math.round(b.pr * 100)}%）`).join("、");
const sureB = bl.filter(b => b.pr >= 1 - 1e-9);
if (sureB.length) t += `<br><b>一定有寶藏：</b>` + sureB.map(b => placeName(b.cells)).join("、");
t += `<br><span class="small">合併的格子＝同一個寶藏可能放的位置，% 是整件寶藏在該位置的機率。</span>`;
} else {
t = `<b>建議先挖：</b>` + picks.map(i => `${pos(i)}（${Math.round(prob[i] * 100)}%）`).join("、");
const sure = [];
for (let i = 0; i < N * N; i++) if (state[i] === 0 && prob[i] >= 1 - 1e-9) sure.push(i);
if (sure.length) t += `<br><b>一定有寶藏：</b>` + sure.map(pos).join("、");
}
t += `<br><span class="small">精確計算，共 ${samples.toLocaleString("zh-TW", { maximumFractionDigits: 0 })} 種可能擺法，剩 ${need} 個寶藏未挖完</span>`;
sg.innerHTML = t;
}
document.querySelectorAll(".mode").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
document.querySelectorAll(".lvb").forEach(b => b.classList.toggle("on", Number(b.dataset.lv) === layout));
for (const k of ORDER) {
const e = document.getElementById("c_" + k);
if (e) {
e.textContent = counts[k];
e.closest(".ti").classList.toggle("zero", !counts[k]);
}
}
renderBar();
updateCalc();
renderPlc();
}
function updateCalc() {
const b = document.getElementById("calc");
let t, cls = "calcbtn", icon = false;
if (running) { t = "計算中…"; cls += " busy"; }
else if (dirty) { t = "計算機率（盤面已變更）"; cls += " hot"; icon = true; }
else if (!samples) { t = "找不到符合的擺法（看下方說明）"; cls += " bad"; }
else { t = "重新計算"; icon = true; }
const html = (icon ? PLAY_SVG : "") + `<span>${t}</span>`;
if (b.dataset.h !== html) { b.innerHTML = html; b.dataset.h = html; }
if (b.className !== cls) b.className = cls;
}
function build() {
const lv = document.getElementById("lvs");
lv.innerHTML = [1, 2, 3, 4].map(n => `<button type="button" class="lvb" data-lv="${n}">版面Lv${n}</button>`).join("");
lv.onclick = e => { const b = e.target.closest(".lvb"); if (b) applyLayout(Number(b.dataset.lv)); };
const m = document.getElementById("modes");
m.innerHTML = MODES.map(([k, n]) => `<button type="button" class="mode" data-m="${k}">${n}</button>`).join("");
m.onclick = e => { const b = e.target.closest(".mode"); if (b) { mode = b.dataset.m; sel.clear(); render(); } };
document.getElementById("gbar").onclick = e => {
const b = e.target.closest("button");
if (!b) return;
if (b.dataset.a === "ok") confirmGroup();
else if (b.dataset.a === "cancel") { sel.clear(); render(); }
};
document.getElementById("calc").onclick = () => { schedule(); };
document.getElementById("plc").onclick = e => {
const b = e.target.closest("[data-hl]");
if (!b) return;
const key = b.dataset.hl;
if (hlKey === key) { hlKey = ""; hl = new Set(); }
else { const [k, ix] = key.split(":"); hlKey = key; hl = new Set(PL[k][Number(ix)]); }
render();
};
document.getElementById("shapes").innerHTML = [
["p2", 1, 2, "2格（直/橫）"],
["p3", 1, 3, "3格（直/橫）"],
["q2", 2, 2, "4格（2×2）"],
["q3", 3, 3, "9格（3×3）"]
].map(([k, r, c, t]) => `<div class="shp-row"><span class="shp" style="border-color:${COL[k]};background:${COL[k]}28;grid-template-columns:repeat(${c},14px);grid-template-rows:repeat(${r},14px)">${"<i></i>".repeat(r * c)}</span><span>${t}</span></div>`).join("");
const c = document.getElementById("counts");
const TILE = [
["p2v", "1×2 直", 2, 1],
["p2h", "1×2 橫", 1, 2],
["p3v", "1×3 直", 3, 1],
["p3h", "1×3 橫", 1, 3],
["q2", "2×2", 2, 2],
["q3", "3×3", 3, 3]
];
c.innerHTML = TILE.map(([k, t, r, cc]) => {
const col = COL[k.slice(0, 2)];
return `<div class="ti"><span class="ic"><span class="sh" style="grid-template-columns:repeat(${cc},11px)">${`<i style="background:${col}"></i>`.repeat(r * cc)}</span></span><span class="tx"><span>${t}</span><b id="c_${k}"></b></span></div>`;
}).join("");
document.getElementById("grid").onclick = e => {
const b = e.target.closest(".cell");
if (!b) return;
let i = Number(b.dataset.i);
const bk = bmap.get(i);
if (bk) {
if (mode === "group") {
const all = bk.cells.every(x => sel.has(x));
for (const x of bk.cells) all ? sel.delete(x) : sel.add(x);
render();
return;
}
const rc = b.getBoundingClientRect();
const dr = Math.min(bk.h - 1, Math.max(0, Math.floor((e.clientY - rc.top) / rc.height * bk.h)));
const dc = Math.min(bk.w - 1, Math.max(0, Math.floor((e.clientX - rc.left) / rc.width * bk.w)));
i = (Math.floor(i / N) + dr) * N + (i % N) + dc;
}
if (mode === "group") {
if (state[i] === 1 || state[i] >= 3) return;
if (sel.has(i)) sel.delete(i); else sel.add(i);
render();
return;
}
pushHist();
if (mode === "empty" && state[i] < 3) state[i] = state[i] === 1 ? 0 : 1;
else clearCell(i);
save();
touch();
render();
};
document.getElementById("reset").onclick = () => {
if (confirm("確定要全部重設嗎？")) {
pushHist();
sel.clear();
defaults();
save();
touch();
render();
}
};
}
load();
build();
getWorker();
render();
schedule();
</script>
</body>
</html>
